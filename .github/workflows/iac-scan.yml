name: IaC Security Scan

on:
  workflow_dispatch:
    inputs:
      severity:
        description: 'Comma-separated severities to fail on'
        required: true
        default: 'CRITICAL,HIGH'
        type: string
      fail_on_findings:
        description: 'Fail workflow when matching findings are detected'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'kubernetes/**'
      - 'terraform/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'kubernetes/**'
      - 'terraform/**'

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_SEVERITY: ${{ github.event_name == 'workflow_dispatch' && inputs.severity || 'CRITICAL,HIGH' }}
      TRIVY_EXIT_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_on_findings == 'false' && '0' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan infrastructure as code
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          ignore-unfixed: true
          skip-dirs: .git,terraform/.terraform
          format: table
