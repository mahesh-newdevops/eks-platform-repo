name: EKS Cluster And AWS Addons

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      layer:
        description: 'Terraform layer/scope to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cluster-foundation
          - aws-addons
          - compute
          - argocd-bootstrap
      environment:
        description: 'Environment to deploy (dev|prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws_region:
        description: 'AWS region for infrastructure'
        required: true
        default: 'ap-south-1'
        type: string
      state_bucket:
        description: 'S3 bucket for Terraform state'
        required: true
        default: 'eks-terraform-state-prod'
        type: string
      dynamodb_table:
        description: 'DynamoDB table for Terraform state locking'
        required: true
        default: 'terraform-locks'
        type: string
      confirm_destroy:
        description: 'Required for prod destroy. Type destroy-prod to continue.'
        required: false
        default: ''
        type: string
      bootstrap_argocd:
        description: 'Create/update the ArgoCD root application after cluster apply'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      gitops_repo_url:
        description: 'GitOps repo URL that ArgoCD root application should track'
        required: false
        default: 'https://github.com/mahesh-newdevops/gitops-platform.git'
        type: string
      gitops_target_revision:
        description: 'Git revision for the GitOps root application'
        required: false
        default: 'main'
        type: string
      gitops_root_path:
        description: 'Path inside the GitOps repo for the root app-of-apps'
        required: false
        default: 'argocd'
        type: string

jobs:
  cluster:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_region: ${{ inputs.aws_region }}
      AWS_REGION: ${{ inputs.aws_region }}
      TF_STATE_BUCKET: ${{ inputs.state_bucket }}
      TF_STATE_KEY: ${{ inputs.environment }}/eks/terraform.tfstate
      TF_LOCK_TABLE: ${{ inputs.dynamodb_table }}
      TF_INPUT: false
      TF_VAR_argocd_root_app_enabled: ${{ inputs.bootstrap_argocd }}
      TF_VAR_argocd_root_app_name: root-app
      TF_VAR_argocd_root_app_target_revision: ${{ inputs.gitops_target_revision }}
      TF_VAR_argocd_root_app_path: ${{ inputs.gitops_root_path }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORMAWS }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks-cluster

      - name: Resolve backend bucket
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "${TF_STATE_BUCKET}" = "eks-terraform-state-prod" ]; then
            TF_STATE_BUCKET="eks-terraform-state-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          fi
          echo "TF_STATE_BUCKET=${TF_STATE_BUCKET}" >> "${GITHUB_ENV}"
          echo "Using backend bucket: ${TF_STATE_BUCKET}"
          echo "Using state key: ${TF_STATE_KEY}"
          echo "Using lock table: ${TF_LOCK_TABLE}"

      - name: Resolve ArgoCD root application source
        run: |
          set -euo pipefail
          GITOPS_REPO_URL="${{ inputs.gitops_repo_url }}"
          if [ -z "${GITOPS_REPO_URL}" ]; then
            GITOPS_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          echo "TF_VAR_argocd_root_app_repo_url=${GITOPS_REPO_URL}" >> "${GITHUB_ENV}"
          echo "Using ArgoCD root app source: ${GITOPS_REPO_URL}:${{ inputs.gitops_target_revision }}/${{ inputs.gitops_root_path }}"

      - name: Resolve Terraform layer targets
        run: |
          set -euo pipefail

          case "${{ inputs.layer }}" in
            all)
              TARGET_ARGS=""
              ;;
            cluster-foundation)
              TARGET_ARGS="-target=aws_vpc.this -target=aws_internet_gateway.this -target=aws_subnet.public -target=aws_route_table.public -target=aws_route_table_association.public -target=module.eks.aws_eks_cluster.this -target=module.eks.aws_iam_openid_connect_provider.oidc_provider"
              ;;
            aws-addons)
              TARGET_ARGS="-target=aws_iam_role.ebs_csi_driver -target=aws_iam_role_policy_attachment.ebs_csi_driver -target=module.eks.aws_eks_addon.before_compute -target=module.eks.aws_eks_addon.this"
              ;;
            compute)
              TARGET_ARGS="-target=module.eks.module.eks_managed_node_group -target=aws_iam_role.aws_load_balancer_controller -target=aws_iam_policy.aws_load_balancer_controller -target=aws_iam_role_policy_attachment.aws_load_balancer_controller -target=aws_eks_pod_identity_association.aws_load_balancer_controller -target=aws_iam_role.external_secrets -target=aws_iam_policy.external_secrets -target=aws_iam_role_policy_attachment.external_secrets -target=aws_eks_pod_identity_association.external_secrets -target=module.karpenter"
              ;;
            argocd-bootstrap)
              TARGET_ARGS="-target=helm_release.argocd -target=kubectl_manifest.argocd_root_app"
              ;;
            *)
              echo "Unsupported layer: ${{ inputs.layer }}"
              exit 1
              ;;
          esac

          echo "TF_TARGET_ARGS=${TARGET_ARGS}" >> "${GITHUB_ENV}"
          if [ -n "${TARGET_ARGS}" ]; then
            echo "Using targeted Terraform scope for layer '${{ inputs.layer }}'. Run layer 'all' regularly to detect drift across the whole state."
          else
            echo "Using full Terraform state."
          fi

      - name: Block unsafe destroy
        if: inputs.action == 'destroy' && inputs.environment == 'prod' && inputs.confirm_destroy != 'destroy-prod'
        run: |
          echo "Prod destroy requires confirm_destroy=destroy-prod."
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init and validate
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"
          terraform validate

      - name: Terraform plan
        if: inputs.action == 'plan'
        working-directory: terraform
        run: terraform plan ${TF_TARGET_ARGS} -var="environment=${{ inputs.environment }}"

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: terraform
        run: |
          terraform plan ${TF_TARGET_ARGS} -var="environment=${{ inputs.environment }}" -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Check cluster nodes and AWS add-ons
        if: inputs.action == 'apply' && (inputs.layer == 'all' || inputs.layer == 'aws-addons' || inputs.layer == 'argocd-bootstrap')
        working-directory: terraform
        run: |
          set -euo pipefail

          CLUSTER_NAME=$(terraform output -raw cluster_name)
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

          if [ "${{ inputs.layer }}" = "all" ] || [ "${{ inputs.layer }}" = "aws-addons" ]; then
            echo "Waiting for nodes to join and become Ready..."
            kubectl wait --for=condition=Ready nodes --all --timeout=15m
            kubectl get nodes -o wide

            echo "Checking EKS add-on status..."
            for addon in vpc-cni kube-proxy coredns eks-pod-identity-agent aws-ebs-csi-driver; do
              aws eks describe-addon \
                --cluster-name "${CLUSTER_NAME}" \
                --region "${AWS_REGION}" \
                --addon-name "${addon}" \
                --query 'addon.{Name:addonName,Version:addonVersion,Status:status,Health:health.issues}' \
                --output table
            done

            kubectl rollout status daemonset/aws-node -n kube-system --timeout=10m
            kubectl rollout status daemonset/kube-proxy -n kube-system --timeout=10m
            kubectl rollout status deployment/coredns -n kube-system --timeout=10m
          fi

          if [ "${{ inputs.layer }}" = "all" ] || [ "${{ inputs.layer }}" = "argocd-bootstrap" ]; then
            kubectl rollout status deployment/argocd-server -n argocd --timeout=10m
          fi

          if [ "${{ inputs.bootstrap_argocd }}" = "true" ] && { [ "${{ inputs.layer }}" = "all" ] || [ "${{ inputs.layer }}" = "argocd-bootstrap" ]; }; then
            kubectl get application.argoproj.io/root-app -n argocd -o wide
          fi

      - name: Terraform destroy plan
        if: inputs.action == 'destroy'
        working-directory: terraform
        run: terraform plan -destroy ${TF_TARGET_ARGS} -var="environment=${{ inputs.environment }}"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: terraform
        run: terraform destroy ${TF_TARGET_ARGS} -var="environment=${{ inputs.environment }}" -auto-approve
