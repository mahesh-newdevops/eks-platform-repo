name: S3 Terraform Backend

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - destroy
      bucket_name:
        description: 'S3 bucket for Terraform state'
        required: true
        default: 'eks-terraform-state-prod'
        type: string
      dynamodb_table:
        description: 'DynamoDB table for Terraform state locking'
        required: true
        default: 'terraform-locks'
        type: string
      backend_region:
        description: 'AWS region for the backend resources'
        required: true
        default: 'ap-south-1'
        type: string
      force_destroy_bucket:
        description: 'When destroying, delete all objects and versions before deleting the bucket'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      destroy_confirm:
        description: "Type 'CONFIRM' to allow destroy"
        required: false
        default: ''
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET_NAME: ${{ inputs.bucket_name }}
      DYNAMODB_TABLE: ${{ inputs.dynamodb_table }}
      BACKEND_REGION: ${{ inputs.backend_region }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORMAWS }}
          aws-region: ${{ inputs.backend_region }}
          role-session-name: github-actions-s3-backend

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create S3 backend
        if: inputs.action == 'create'
        run: |
          set -euo pipefail

          echo "Creating or verifying S3 bucket: ${BUCKET_NAME}"
          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "Bucket already exists and is accessible."
          elif [ "${BACKEND_REGION}" = "us-east-1" ]; then
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${BACKEND_REGION}"
          else
            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${BACKEND_REGION}" \
              --create-bucket-configuration LocationConstraint="${BACKEND_REGION}"
          fi

          aws s3api wait bucket-exists --bucket "${BUCKET_NAME}"

          echo "Enabling versioning, encryption, and public access blocking"
          aws s3api put-bucket-versioning \
            --bucket "${BUCKET_NAME}" \
            --versioning-configuration Status=Enabled \
            --region "${BACKEND_REGION}"

          aws s3api put-bucket-encryption \
            --bucket "${BUCKET_NAME}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' \
            --region "${BACKEND_REGION}"

          aws s3api put-public-access-block \
            --bucket "${BUCKET_NAME}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true \
            --region "${BACKEND_REGION}"

          echo "Creating or verifying DynamoDB lock table: ${DYNAMODB_TABLE}"
          if aws dynamodb describe-table --table-name "${DYNAMODB_TABLE}" --region "${BACKEND_REGION}" >/dev/null 2>&1; then
            echo "DynamoDB table already exists."
          else
            aws dynamodb create-table \
              --table-name "${DYNAMODB_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${BACKEND_REGION}"

            aws dynamodb wait table-exists \
              --table-name "${DYNAMODB_TABLE}" \
              --region "${BACKEND_REGION}"
          fi

          cat <<EOF

          Backend configuration created.
          Use this in terraform/backend.tf:

          terraform {
            backend "s3" {}
          }

          GitHub Actions supplies backend configuration per environment:
          - bucket: ${BUCKET_NAME}
          - region: ${BACKEND_REGION}
          - lock table: ${DYNAMODB_TABLE}
          - dev:  dev/eks/terraform.tfstate
          - prod: prod/eks/terraform.tfstate
          EOF

      - name: Require destroy confirmation
        if: inputs.action == 'destroy' && inputs.destroy_confirm != 'CONFIRM'
        run: |
          echo "Destroy was requested, but destroy_confirm was not CONFIRM."
          exit 1

      - name: Empty versioned bucket
        if: inputs.action == 'destroy' && inputs.force_destroy_bucket == 'true' && inputs.destroy_confirm == 'CONFIRM'
        run: |
          set -euo pipefail

          echo "Installing jq"
          sudo apt-get update
          sudo apt-get install -y jq

          echo "Deleting all object versions and delete markers from ${BUCKET_NAME}"
          if ! aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "S3 bucket does not exist or is not accessible."
            exit 0
          fi

          aws s3api list-object-versions --bucket "${BUCKET_NAME}" --region "${BACKEND_REGION}" --output json \
            | jq -r '.Versions[]?, .DeleteMarkers[]? | [.Key, .VersionId] | @tsv' \
            | while IFS=$'\t' read -r key version_id; do
                aws s3api delete-object \
                  --bucket "${BUCKET_NAME}" \
                  --key "${key}" \
                  --version-id "${version_id}" \
                  --region "${BACKEND_REGION}"
              done

          aws s3 rm "s3://${BUCKET_NAME}" --recursive --region "${BACKEND_REGION}" || true

      - name: Destroy S3 backend
        if: inputs.action == 'destroy' && inputs.destroy_confirm == 'CONFIRM'
        run: |
          set -euo pipefail

          echo "Deleting S3 bucket if it exists: ${BUCKET_NAME}"
          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            aws s3api delete-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${BACKEND_REGION}"
          else
            echo "S3 bucket does not exist or is not accessible."
          fi

          echo "Deleting DynamoDB lock table if it exists: ${DYNAMODB_TABLE}"
          if aws dynamodb describe-table --table-name "${DYNAMODB_TABLE}" --region "${BACKEND_REGION}" >/dev/null 2>&1; then
            aws dynamodb delete-table \
              --table-name "${DYNAMODB_TABLE}" \
              --region "${BACKEND_REGION}"
            aws dynamodb wait table-not-exists \
              --table-name "${DYNAMODB_TABLE}" \
              --region "${BACKEND_REGION}"
          else
            echo "DynamoDB table does not exist."
          fi
