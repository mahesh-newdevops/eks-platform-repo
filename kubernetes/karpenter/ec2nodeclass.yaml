apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default

spec:
  amiFamily: AL2023

  role: __KARPENTER_NODE_ROLE__

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: __KARPENTER_DISCOVERY__

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: __KARPENTER_DISCOVERY__

  amiSelectorTerms:
    - alias: al2023@latest
