apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/platform-repo.git
    targetRevision: HEAD
    path: kubernetes/microservices/backend

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: true
      selfHeal: true