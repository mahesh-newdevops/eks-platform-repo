apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-service
  namespace: order-service
  labels:
    app: order-service
    version: v1
spec:
  serviceName: order-service
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: order-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: order-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - order-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: order-service
        image: order-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "order-service"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: order-service-config
              key: log.level
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: order-service-db-secret
              key: db.host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: order-service-db-secret
              key: db.port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: order-service-db-secret
              key: db.name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: order-service-db-secret
              key: db.user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-service-db-secret
              key: db.password
        - name: USER_SERVICE_URL
          value: "http://user-service.user-service:8080"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service.payment-service:8080"
        - name: JAEGER_AGENT_HOST
          value: "jaeger-agent.monitoring"
        - name: JAEGER_AGENT_PORT
          value: "6831"
        - name: DATA_DIR
          value: "/data"
        - name: CACHE_DIR
          value: "/cache"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: order-service
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ebs-gp3-encrypted
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: cache
      labels:
        app: order-service
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ebs-gp3-standard
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: order-service
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: order-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: order-service
data:
  log.level: "info"
