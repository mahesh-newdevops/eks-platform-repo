apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: python:3.12-slim

          command: ["python"]

          args:
            - -m
            - http.server
            - "5000"

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi